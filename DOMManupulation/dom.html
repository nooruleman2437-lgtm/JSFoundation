<!--Event delegation is a technique where you attach a single event listener to a parent element instead of adding individual listeners to each child element.

Quiz 5 Event delegation (Click on any name to select it)-->

<p>Click on any name to slect it</p>

<!--Form handling means:
>Capturing the form data when a user submits it.
>Validating it (optional).
>Processing or displaying it (e.g., showing it on the page, saving, sending to a server, etc.).
Quiz 6-->
<section>
    <form id="feedbackForm">
<label for="feedbackInput">Your Feedback</label>
<input type="text" id ="feedbackInput"placeholder ="Enter your feed back please"/>
<button type="submit">Submit Feedback</button>
</form>

</section>
